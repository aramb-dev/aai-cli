[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aai-cli"
dynamic = ["version"]
description = "Unofficial, automation-friendly AssemblyAI command-line client"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "aai-cli contributors"}]
keywords = ["assemblyai", "speech-to-text", "transcription", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=12"]

[project.scripts]
aai = "aai.main:main"

[project.urls]
Homepage = "https://github.com/aramb-dev/aai-cli"
Source = "https://github.com/aramb-dev/aai-cli"
Issues = "https://github.com/aramb-dev/aai-cli/issues"
Changelog = "https://github.com/aramb-dev/aai-cli/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "aai.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
