name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.9 build for ubuntu-latest (26.04); 24.04 still has one.
          - python: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Installed entry point
        run: aai --version && aai schema --compact
